---
schemaVersion: "2.0.0"
commandTests:
  - name: PostgreSQL version
    command: pg_config
    args:
      - --version
    expectedOutput:
      - PostgreSQL 18.
  - name: pg_textsearch default version SQL file
    command: sh
    args:
      - -ec
      - |
        grep -Eq "^default_version *= *'[0-9]+(\.[0-9]+)*'" /usr/share/postgresql/18/extension/pg_textsearch.control
        sed -n "s/^default_version *= *'\([^']*\)'.*/\1/p" /usr/share/postgresql/18/extension/pg_textsearch.control \
          | xargs -I VERSION test -f /usr/share/postgresql/18/extension/pg_textsearch--VERSION.sql
    exitCode: 0
fileExistenceTests:
  - name: pg_textsearch library
    path: /usr/lib/postgresql/18/lib/pg_textsearch.so
    shouldExist: true
  - name: pg_textsearch control file
    path: /usr/share/postgresql/18/extension/pg_textsearch.control
    shouldExist: true
